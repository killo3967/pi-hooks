name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for trusted publishing: lets the job mint a short-lived OIDC token
  # that npm exchanges for publish rights. No long-lived npm token is involved.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@killo3967/pi-hooks@$VERSION" version >/dev/null 2>&1; then
            echo "@killo3967/pi-hooks@$VERSION is already on the registry, nothing to publish."
            exit 0
          fi
          npm publish
